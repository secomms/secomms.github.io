# ---------------------------------------------------------------------------
# Group members.
#
# The Publications page queries DBLP once per member and keeps a record when:
#   * the member has a `dblp_pid`  -> a co-author of the record carries that PID
#                                     (exact, homonym-proof match), OR
#   * the member has no `dblp_pid` -> a co-author name matches `name`
#                                     (used for members whose name is distinctive).
#
# To make any member's matching exact, look up their profile on dblp.org and
# copy the number from the URL (e.g. dblp.org/pid/26/3594.html -> "26/3594")
# into `dblp_pid`. Set `in_publications: false` to exclude someone entirely.
# ---------------------------------------------------------------------------


<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{- $title := .Title | default .Site.Title -}}
{{- $desc := .Description | default .Site.Params.description -}}
<title>{{ if .IsHome }}{{ .Site.Params.short_name }} — {{ .Site.Title }}{{ else }}{{ $title }} · {{ .Site.Params.short_name }}{{ end }}</title>
<meta name="description" content="{{ $desc }}">
<link rel="canonical" href="{{ .Permalink }}">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="{{ $title }} · {{ .Site.Params.short_name }}">
<meta property="og:description" content="{{ $desc }}">
<meta property="og:site_name" content="{{ .Site.Params.short_name }} — {{ .Site.Title }}">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Favicon: minimal inline mark -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232B36D9'/%3E%3Cg fill='%23fff'%3E%3Crect x='7' y='7' width='5' height='5' rx='1'/%3E%3Crect x='20' y='7' width='5' height='5' rx='1'/%3E%3Crect x='13.5' y='13.5' width='5' height='5' rx='1' fill='%23E0901B'/%3E%3Crect x='7' y='20' width='5' height='5' rx='1'/%3E%3Crect x='20' y='20' width='5' height='5' rx='1'/%3E%3C/g%3E%3C/svg%3E">

<link rel="stylesheet" href="{{ "assets/css/style.css" | relURL }}">

{{ define "main" }}
{{ partial "page-head.html" . }}
<section class="section section--tight">
  <div class="wrap">

    <div class="pub-toolbar">
      <input id="pub-search" type="search" placeholder="Search title or author…" aria-label="Search publications">
      <select id="pub-type" aria-label="Filter by type">
        <option value="">All types</option>
        <option value="Journal">Journal articles</option>
        <option value="Conference">Conference &amp; workshop</option>
        <option value="Preprint">Preprints &amp; reports</option>
        <option value="Other">Other</option>
      </select>
      <select id="pub-year" aria-label="Filter by year">
        <option value="">All years</option>
      </select>
      <span class="pub-count" id="pub-count"></span>
    </div>

    <div id="pub-list" aria-live="polite">
      <div class="state"><span class="spinner"></span> Fetching publications from DBLP…</div>
    </div>

    <p style="font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:26px">
      Data sourced from <a href="https://dblp.org" rel="noopener">dblp.org</a>.
      Missing a paper? It appears here once it is indexed on DBLP and linked to a
      group member's profile.
    </p>
  </div>
</section>

<script>
  /* Authors to query, generated from data/members.yml.
     pid = exact DBLP match (homonym-proof); empty pid = match by name. */
  {{- $authors := slice -}}
  {{- range $g := (slice .Site.Data.members.faculty .Site.Data.members.postdocs .Site.Data.members.phd .Site.Data.members.alumni) -}}
    {{- range $g -}}
      {{- if ne .in_publications false -}}
        {{- $authors = $authors | append (dict "name" .name "pid" (default "" .dblp_pid)) -}}
      {{- end -}}
    {{- end -}}
  {{- end }}
  window.SECOMMS_AUTHORS = {{ $authors | jsonify | safeJS }};
  window.SECOMMS_DBLP_ENDPOINT = {{ .Site.Params.dblp_search_endpoint | jsonify | safeJS }};
</script>
<script src="{{ "assets/js/publications.js" | relURL }}"></script>
{{ end }}
